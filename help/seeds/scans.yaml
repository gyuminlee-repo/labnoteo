# basic의 워크플로 노트에 노트 ID를 고정한다. 기록지 사진(seeds/<lang>/worksheet-scan.jpg)의 QR이
# 이 ID를 담고 있어서, 시드를 다시 만들어도 스캔이 이 노트로 돌아온다.
# 워크플로를 만들 때 무작위 labnote_id가 들어가므로 fs.patch로는 찾을 수 없어, 그 줄만 바꾼다.
id: scans
from: basic
steps:
  - tool: eval
    args:
      expression:
        ko: "(async () => { const f = app.vault.getAbstractFileByPath('labnote/001_GFP_발현/001_WB030_DNA_Assembly_1차.labnote.md'); await app.vault.process(f, d => { if (!/^labnote_id: .*$/m.test(d)) throw new Error('no labnote_id'); return d.replace(/^labnote_id: .*$/m, 'labnote_id: LN-DEM0SCAN'); }); return (await app.vault.read(f)).match(/^labnote_id: .*$/m)[0]; })()"
        en: "(async () => { const f = app.vault.getAbstractFileByPath('labnote/001_GFP_expression/001_WB030_DNA_Assembly_run1.labnote.md'); await app.vault.process(f, d => { if (!/^labnote_id: .*$/m.test(d)) throw new Error('no labnote_id'); return d.replace(/^labnote_id: .*$/m, 'labnote_id: LN-DEM0SCAN'); }); return (await app.vault.read(f)).match(/^labnote_id: .*$/m)[0]; })()"
  - wait: 1500
