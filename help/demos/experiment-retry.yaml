id: experiment-retry
order: 7
section: quick
title: { ko: 실험 다시 하기, en: Retry an experiment }
seed: retry
steps:
  - caption: { ko: 워크플로 뷰를 엽니다, en: Open the workflow view }
    tool: ribbon_click
    args: { label: $t(Workflows) }
    hold: 1000
  - caption: { ko: 묶음을 담당자별로 바꿉니다(목록 창은 영상에 안 보임), en: Switch grouping to By author (the drop-down is not shown in video) }
    highlight: { selector: .labnote-workflow-group-by }
  - tool: eval
    args:
      expression: "(() => { const s = document.querySelector('.labnote-workflow-group-by'); s.value = 'author'; s.dispatchEvent(new Event('change')); return s.value; })()"
    hold: 1000
  - caption: { ko: README의 author로 실험이 나뉩니다, en: Experiments are split by the README's author }
    highlight: { selector: .labnote-tree-row, text: Minji Park }
  - caption: { ko: 실패한 실험을 우클릭 → 이 실험 다시 하기, en: Right-click the failed experiment → Retry this experiment }
    tool: labnoteo_tree_click
    args: { view: workflow, label: { ko: 형질전환 효율 비교, en: Transformation efficiency }, button: right }
  - tool: ui_click
    args: { selector: .menu-item, text: $t(Retry this experiment) }
  - caption: { ko: 제목에 2차가 붙어 있습니다. 그대로 만듭니다, en: The title is filled in as a retry; keep it }
    tool: modal_answer
    args: { answers: [true] }
    hold: 1200
  - caption: { ko: 새 README의 retry_of가 원래 실험을 가리킵니다, en: The new README's retry_of points to the original }
    highlight: { selector: '.metadata-property[data-property-key="retry_of"]' }
    poster: true
    hold: 1500
  - caption: { ko: author도 원래 실험에서 가져왔습니다, en: The author comes from the original too }
    highlight: { selector: '.metadata-property[data-property-key="author"]' }
    hold: 1500
