id: worksheet-print
order: 23
section: scan
title: { ko: 실험 기록지 출력, en: Print experiment worksheet }
seed: scans
steps:
  - caption: { ko: 워크플로 노트를 엽니다, en: Open the workflow note }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/001_WB030_DNA_Assembly_1차.labnote.md, en: labnote/001_GFP_expression/001_WB030_DNA_Assembly_run1.labnote.md } }
    hold: 800
  - caption: { ko: 노트 위 QR 아이콘으로 노트 ID를 봅니다, en: The QR icon at the top of the note shows its ID }
    tool: ui_click
    args: { selector: .view-action, text: $t(Show note barcode) }
  - highlight: { selector: .labnoteo-barcode }
  - caption: { ko: 기록지의 QR이 이 ID로 사진을 노트에 돌려보냅니다, en: The worksheet's QR codes bring photos back to this note by this ID }
    highlight: { selector: .modal p, text: LN-DEM0SCAN }
  - tool: ui_press
    args: { keys: Escape }
  - caption: { ko: 팔레트에서 실험 기록지 출력을 실행합니다, en: Run Print experiment worksheet from the palette }
    palette: print-experiment-worksheet
    hold: 800
  - caption: { ko: 실험실 유닛 오퍼레이션은 미리 켜져 있습니다, en: Lab unit operations are already turned on }
    highlight: { selector: .modal .setting-item, text: UHW100 }
  - caption: { ko: 용지는 A4와 Letter 중에서 고릅니다, en: Pick A4 or Letter paper }
    highlight: { selector: .modal .setting-item, text: $t(Paper size) }
    poster: true
  - caption: { ko: 출력을 누르면 인쇄 창이 열립니다(영상에 안 보임), en: Print opens the print dialog (not shown in video) }
    highlight: { selector: .modal button, text: $t(Print) }
  - caption: { ko: 안 되면 브라우저에서 열어 출력합니다. 배율은 100%, en: "If that fails, open it in the browser. Print at 100% scale" }
    highlight: { selector: .modal button, text: $t(Open in browser) }
    hold: 1500
