id: overview
order: 2
section: start
title: { ko: 전체 흐름 한눈에 보기, en: The whole flow at a glance }
seed: empty
long: true
steps:
  - caption: { ko: "팔레트(Ctrl+P)에 '실험 생성'을 칩니다", en: Type Create experiment in the palette (Ctrl+P) }
    palette: create-experiment
  - caption: { ko: 제목을 넣으면 실험 폴더와 README가 생깁니다, en: A title creates the experiment folder and README }
    tool: modal_fill
    args: { value: { ko: GFP 발현, en: GFP expression }, submit: true }
    hold: 1200
  - caption: { ko: 한글·영문 어느 쪽으로도 찾을 수 있습니다, en: Create workflow picks a step from the catalog }
    palette: { id: create-workflow, type: en }
  - caption: { ko: 카탈로그에서 워크플로를 고릅니다, en: Pick a workflow from the catalog }
    tool: modal_pick
    args: { filter: { ko: 클로닝, en: assembly }, text: WB030 }
  - caption: { ko: 별칭을 붙이면 워크플로 노트가 생깁니다, en: Give it an alias to create the workflow note }
    tool: modal_fill
    args: { value: { ko: 1차, en: run1 }, submit: true }
    hold: 1200
  - caption: { ko: 워크플로 안에 유닛 오퍼레이션을 넣습니다, en: Insert a unit operation into the workflow }
    palette: insert-unit-operation
  - tool: modal_pick
    args: { filter: PCR, text: UHW100 }
  - tool: modal_fill
    args: { value: { ko: GFP 증폭, en: GFP amplification }, submit: true }
    hold: 1200
  - caption: { ko: "Input에 @DNA; 를 쳐서 샘플을 참조합니다", en: "Type @DNA; under Input to reference a sample" }
    tool: editor_move
    args: { text: (samples from the previous step), ch: 2 }
  - tool: editor_move
    args: { ch: end, extend: true }
  - tool: ui_type
    args: { text: '@DNA;' }
  - tool: ui_click
    args: { selector: .suggestion-item, text: { ko: 새 DNA ID 생성, en: Generate new DNA ID } }
  - caption: { ko: 별칭·설명·보관 위치를 적으면 ID가 생깁니다, en: "Alias, description and location give it a new ID" }
    tool: modal_answer
    args: { answers: [{ ko: GFP 주형, en: GFP template }, { ko: GFP 서열 플라스미드, en: Plasmid carrying GFP }, { ko: -20도 냉동고 1칸, en: "-20 freezer, shelf 1" }] }
    hold: 1500
  - caption: { ko: 실험 상태를 in-progress로 바꿉니다, en: Change the experiment status to in-progress }
    palette: change-experiment-status
  - tool: modal_pick
    args: { text: in-progress }
    poster: true
    hold: 1200
  - caption: { ko: 막히면 '사용법 열기'로 QUICKSTART를 엽니다, en: Stuck? Open user guide opens QUICKSTART }
    palette: open-user-guide
    hold: 1000
  - highlight: { selector: .nav-file-title, text: QUICKSTART }
    hold: 1500
