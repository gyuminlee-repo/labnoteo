id: ai-summarize-results
order: 31
section: ai
title: { ko: "AI: 워크플로 결과 요약", en: "AI: Summarize workflow results" }
seed: basic
ai: true
steps:
  - caption: { ko: 결과를 적은 워크플로 노트를 엽니다, en: Open a workflow note with results written in }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/001_WB030_DNA_Assembly_1차.labnote.md, en: labnote/001_GFP_expression/001_WB030_DNA_Assembly_run1.labnote.md } }
  - caption: { ko: "팔레트에서 AI: 워크플로 결과 요약", en: "Run AI: Summarize workflow results from the palette" }
    palette: ai-summarize-results
  - tool: ui_wait
    args: { notice: '', timeoutMs: 300000 }
    fastForward: true
  - tool: eval
    args:
      expression: "(() => { const e = app.workspace.activeEditor.editor; const end = { line: e.lastLine(), ch: 0 }; e.scrollIntoView({ from: end, to: end }, true); return true; })()"
  - caption: { ko: Conclusions and Discussion 끝에 요약이 붙습니다, en: A summary callout goes in at the end of Conclusions and Discussion }
    highlight: { selector: '.cm-callout, .cm-line', text: { ko: AI 워크플로 결과 요약, en: AI workflow results summary } }
    poster: true
    hold: 2500
