id: change-experiment-status
order: 6
section: quick
title: { ko: 실험 상태 변경, en: Change experiment status }
seed: multi
steps:
  - caption: { ko: 실험 README를 엽니다. 지금 상태는 planned, en: Open the experiment README; it is planned now }
    tool: open_file
    args: { path: { ko: labnote/002_RFP_프로모터_비교/README.labnote.md, en: labnote/002_RFP_promoter_comparison/README.labnote.md } }
    hold: 800
  - caption: { ko: 워크플로 뷰에서도 planned 묶음에 있습니다, en: The workflow view lists it under planned }
    tool: ribbon_click
    args: { label: $t(Workflows) }
    hold: 800
  - highlight: { selector: .labnote-tree-row, text: { ko: RFP 프로모터 비교, en: RFP promoter comparison } }
  - caption: { ko: 팔레트에서 실험 상태 변경을 실행합니다, en: Run Change experiment status from the palette }
    palette: change-experiment-status
  - caption: { ko: 목록에는 상태마다 뜻이 함께 나옵니다. in-progress를 고릅니다, en: The list says what each status means; pick in-progress }
    tool: modal_pick
    args: { text: in-progress }
  - caption: { ko: README의 status가 바뀌었습니다, en: The README status has changed }
    highlight: { selector: '.metadata-property[data-property-key="status"]' }
  - caption: { ko: 워크플로 뷰에서 in-progress로 옮겨졌습니다, en: In the workflow view it moved to in-progress }
    tool: ui_wait
    args: { selector: .labnote-tree-row, text: "in-progress [3]" }
  - highlight: { selector: .labnote-tree-row, text: { ko: RFP 프로모터 비교, en: RFP promoter comparison } }
    poster: true
  - caption: { ko: 워크플로 뷰에서 우클릭해도 바꿀 수 있습니다, en: Or right-click it in the workflow view }
    tool: labnoteo_tree_click
    args: { view: workflow, label: { ko: RFP 프로모터 비교, en: RFP promoter comparison }, button: right }
  - tool: ui_click
    args: { selector: .menu-item, text: $t(Change experiment status) }
  - tool: modal_pick
    args: { text: completed }
  - caption: { ko: 마무리 안 된 곳이 있으면 한 번 더 묻습니다, en: "If the work looks unfinished, it asks once more" }
    highlight: { selector: .modal }
    hold: 1500
  - tool: modal_button
    args: { text: $t(Mark completed) }
  - caption: { ko: completed 묶음으로 옮겨졌습니다, en: It moved to the completed group }
    tool: ui_wait
    args: { selector: .labnote-tree-row, text: "completed [2]" }
  - highlight: { selector: .labnote-tree-row, text: { ko: RFP 프로모터 비교, en: RFP promoter comparison } }
    hold: 1500
