id: sample-search-delete
order: 21
section: samples
title: { ko: 샘플 찾기와 지우기, en: Find and delete samples }
seed: samples
steps:
  - caption: { ko: 샘플 뷰를 엽니다, en: Open the Samples view }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/002_WB140_Liquid_Media_Cell_Culture_플라스크.labnote.md, en: labnote/001_GFP_expression/002_WB140_Liquid_Media_Cell_Culture_flask.labnote.md } }
  - tool: ribbon_click
    args: { label: $t(Samples) }
    hold: 1000
  - caption: { ko: 검색 칸은 보관 위치로도 찾습니다, en: The search box also finds samples by storage location }
    tool: ui_click
    args: { selector: .labnote-sample-search }
  - tool: ui_type
    args: { text: { ko: 냉동고, en: freezer } }
    hold: 1000
  - highlight: { selector: .labnote-tree-row, text: Plasmid-2001 }
    hold: 1200
  - caption: { ko: 우클릭 → 샘플 삭제, en: Right-click → Delete sample }
    tool: ui_click
    args: { selector: .labnote-tree-row, text: Plasmid-2001, button: right }
  - tool: ui_click
    args: { selector: .menu-item, text: $t(Delete sample) }
    hold: 800
  - caption: { ko: 노트에서 쓰이는 샘플이라 어디서 쓰는지 알려 줍니다, en: "It is still used in a note, so the window says where" }
    highlight: { selector: .modal }
    poster: true
    hold: 2500
  - caption: { ko: 지우는 대신 폐기로 표시할 수 있습니다. 여기서는 취소, en: "Mark it discarded instead, or cancel as here" }
    tool: ui_press
    args: { keys: Escape }
    hold: 1000
