id: scan-import
order: 24
section: scan
title: { ko: 스캔 붙이기, en: File scans in notes }
seed: scans
steps:
  - caption: { ko: 리본의 스캔 아이콘으로 스캔 가져오기를 엽니다, en: Open Import scanned pages from the scan icon in the ribbon }
    tool: ribbon_click
    args: { label: $t(Import scanned pages) }
    hold: 1000
  - caption: { ko: 기록지 사진을 끌어다 놓거나 클릭해서 고릅니다, en: "Drop photos of printed worksheets here, or click to choose" }
    highlight: { selector: .modal div, text: "$t(Drop files here, or click to choose)" }
  - tool: labnoteo_scan_import
    args: { files: [worksheet-scan.jpg] }
    hold: 800
  - caption: { ko: QR을 읽어 그 유닛 오퍼레이션 블록에 붙이고 블록 이름을 보여 줍니다, en: The QR code was read and the page filed in its unit operation block, named in the result }
    highlight: { selector: .modal .setting-item, text: worksheet-scan.jpg }
  - caption: { ko: 잘못 붙었으면 되돌리기로 뺍니다, en: Undo takes it out again }
    highlight: { selector: .modal button, text: $t(Undo) }
  - caption: { ko: 노트 열기로 붙은 곳을 봅니다, en: Open note shows where it went }
    tool: modal_button
    args: { text: $t(Open note) }
    hold: 1000
  - tool: ui_press
    args: { keys: Escape }
  - tool: ui_click
    args: { selector: .workspace-leaf.mod-active .cm-content }
  - tool: editor_move
    args: { text: Worksheet scans, ch: 0 }
  - caption: { ko: 유닛 오퍼레이션 끝 Worksheet scans에 썸네일이 붙습니다, en: A thumbnail goes under Worksheet scans at the end of the step }
    highlight: { selector: .cm-content .image-embed }
    poster: true
  - caption: { ko: 원본 보기로 원래 크기를 엽니다, en: Open full size shows it at its original size }
    highlight: { selector: .cm-content .cm-hmd-internal-link, text: $t(Open full size) }
    hold: 1500
