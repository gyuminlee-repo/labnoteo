id: sample-definition
order: 19
section: samples
title: { ko: 정의로 이동·사용처 보기, en: Go to definition and View usages }
seed: samples
steps:
  - caption: { ko: 본문의 샘플 참조 위에서 우클릭합니다, en: Right-click a sample reference in the note }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/002_WB140_Liquid_Media_Cell_Culture_플라스크.labnote.md, en: labnote/001_GFP_expression/002_WB140_Liquid_Media_Cell_Culture_flask.labnote.md } }
  - tool: editor_move
    args: { text: DNA-1001, ch: 24 }
  - tool: ui_click
    args: { atCursor: true, button: right }
  - caption: { ko: 정의로 이동을 누르면 정의 창이 열립니다, en: Go to definition opens the definition window }
    tool: ui_click
    args: { selector: .menu-item, text: $t(Go to definition) }
    hold: 1000
  - highlight: { selector: .modal }
    poster: true
    hold: 1200
  - tool: ui_press
    args: { keys: Escape }
  - caption: { ko: 샘플 뷰에서 우클릭 → 사용처 보기, en: "In the Samples view, right-click → View usages" }
    tool: ribbon_click
    args: { label: $t(Samples) }
  - tool: labnoteo_sample_menu
    args: { sample: DNA-1001, item: $t(View usages) }
    hold: 1200
  - caption: { ko: 쓰인 노트 목록에서 골라 엽니다, en: Pick a note from the list to open it }
    tool: modal_pick
    args: { text: 001_WB030 }
    hold: 1500
