id: ai-summarize-experiment
order: 32
section: ai
title: { ko: "AI: 실험 결과 요약", en: "AI: Summarize experiment results" }
seed: basic
ai: true
steps:
  - caption: { ko: 실험 README를 엽니다, en: Open the experiment README }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/README.labnote.md, en: labnote/001_GFP_expression/README.labnote.md } }
  - caption: { ko: "팔레트에서 AI: 실험 결과 요약", en: "Run AI: Summarize experiment results from the palette" }
    palette: ai-summarize-experiment
  - tool: ui_wait
    args: { notice: '', timeoutMs: 300000 }
    fastForward: true
  - tool: eval
    args:
      expression: "(() => { const e = app.workspace.activeEditor.editor; const end = { line: e.lastLine(), ch: 0 }; e.scrollIntoView({ from: end, to: end }, true); return true; })()"
  - caption: { ko: 모든 워크플로 결과를 README 끝에 요약합니다, en: All workflow results are summarized at the end of the README }
    highlight: { selector: '.cm-callout, .cm-line', text: { ko: AI 실험 결과 요약, en: AI experiment results summary } }
    poster: true
    hold: 2500
