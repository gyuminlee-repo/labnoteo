id: uo-reorder
order: 14
section: record
title: { ko: 유닛 오퍼레이션 순서 바꾸기, en: Reorder unit operations }
seed: basic
steps:
  - caption: { ko: 워크플로 노트에서 개요(Outline)를 엽니다, en: Open the Outline for the workflow note }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/001_WB030_DNA_Assembly_1차.labnote.md, en: labnote/001_GFP_expression/001_WB030_DNA_Assembly_run1.labnote.md } }
  - tool: command_palette
    args: { commandId: outline:open }
    hold: 1000
  - caption: { ko: 유닛 오퍼레이션 제목을 다른 블록 위로 끌어 놓습니다, en: Drag a unit operation heading above another block }
    drag:
      from: { selector: '.workspace-leaf-content[data-type="outline"] .tree-item-self', text: UHW230 }
      to: { selector: '.workspace-leaf-content[data-type="outline"] .tree-item-self', text: UHW100 }
      position: before
    hold: 1500
  - caption: { ko: "목차와 --- 구분선이 새 순서로 정리됩니다", en: "The table of contents and --- separators follow the new order" }
    tool: ui_click
    args: { selector: '.workspace-split.mod-root .cm-line', text: Related Unit Operations }
  - highlight: { selector: .cm-line, text: { ko: '| 전기영동 확인', en: '| Gel check' } }
    poster: true
    hold: 1500
