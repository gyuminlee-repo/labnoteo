id: export-tables-csv
order: 16
section: record
title: { ko: 표를 CSV로 내보내기, en: Export tables to CSV }
seed: basic
steps:
  - caption: { ko: 결과 표가 있는 워크플로 노트를 엽니다, en: Open a workflow note that has a results table }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/001_WB030_DNA_Assembly_1차.labnote.md, en: labnote/001_GFP_expression/001_WB030_DNA_Assembly_run1.labnote.md } }
  - tool: editor_move
    args: { line: 54, ch: 0 }
  - highlight: { selector: .cm-table-widget }
    hold: 1200
  - caption: { ko: 팔레트에서 표를 CSV로 내보내기, en: Run Export tables to CSV from the palette }
    palette: export-tables-csv
    hold: 1500
  - caption: { ko: 노트 옆에 표마다 CSV 파일이 생깁니다, en: A CSV file per table appears next to the note }
    highlight: { selector: .nav-file-title, text: _table1 }
    poster: true
    hold: 1500
