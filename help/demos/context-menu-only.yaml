id: context-menu-only
order: 13
section: record
title: { ko: 우클릭 메뉴로만 하기, en: Doing it from right-click menus }
seed: basic
steps:
  - caption: { ko: "README에서 우클릭: 워크플로 삽입", en: "In the README, right-click: Insert workflow" }
    tool: open_file
    args: { path: { ko: labnote/001_GFP_발현/README.labnote.md, en: labnote/001_GFP_expression/README.labnote.md } }
  - tool: editor_move
    args: { text: WB030, ch: end }
  - tool: ui_click
    args: { atCursor: true, button: right }
  - tool: ui_click
    args: { selector: .menu-item, text: $t(Insert workflow) }
  - tool: modal_pick
    args: { filter: { ko: 형질전환, en: transformation }, text: WB120 }
  - tool: modal_fill
    args: { value: { ko: 열충격, en: heat shock }, submit: true }
    hold: 1500
  - caption: { ko: 새로 생긴 워크플로 노트를 엽니다, en: Open the new workflow note }
    tool: ui_click
    args: { selector: .nav-file-title, text: 002_WB120 }
    hold: 800
  - caption: { ko: "워크플로 뷰에서: 유닛 오퍼레이션 우클릭 → 삽입", en: "In the workflow view: right-click a unit operation → Insert" }
    tool: ribbon_click
    args: { label: $t(Workflows) }
  - tool: labnoteo_tree_click
    args: { view: workflow, label: UHW080, button: right }
  - tool: ui_click
    args: { selector: .menu-item, text: $t(Insert unit operation) }
  - tool: modal_fill
    args: { value: { ko: 세포 용해, en: lysis }, submit: true }
    hold: 1500
  - caption: { ko: "파일 탐색기에서: 노트 우클릭 → 표를 CSV로 내보내기", en: "In the file explorer: right-click a note → Export tables to CSV" }
    tool: context_menu
    args:
      selector: .nav-file-title
      text: { ko: 001_WB030_DNA_Assembly_1차, en: 001_WB030_DNA_Assembly_run1 }
      item: $t(Export tables to CSV)
    hold: 1200
  - highlight: { selector: .nav-file-title, text: _table1 }
    poster: true
    hold: 1500
